name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (resolves the icon catalog live, then bundles)
        env:
          # Raises the GitHub API rate limit for the nso-icons tree fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: enables the RAWG fallback for categories with no eShop hit.
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: npm run build

      - name: Fail if the catalog came out empty
        run: |
          count=$(node -p "JSON.parse(require('fs').readFileSync('dist/catalog.json','utf8')).categories.length")
          echo "catalog categories: $count"
          test "$count" -gt 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
